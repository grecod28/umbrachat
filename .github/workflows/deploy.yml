name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Un solo despliegue a la vez. Si llegan varios pushes seguidos se ejecutan en
# orden en lugar de pisarse entre ellos.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy main to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar el secret $name en el repositorio."
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ vars.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Recomendado: guardar la huella del servidor para evitar MITM.
          # Si el secret no existe, la acción no valida la huella.
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 25m
          script_stop: true
          envs: APP_DIR
          script: |
            APP_DIR="${APP_DIR:-/var/www/umbrachat}"
            cd "$APP_DIR"
            bash deploy/deploy.sh
