name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: "24.16.0"
      PNPM_VERSION: "9.0.0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/umbrachat_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret
      THROTTLE_LIMIT: "10000"
      IP_THROTTLE_LIMIT: "10000"
      SESSION_THROTTLE_LIMIT: "10000"
      THROTTLE_BLOCK_MS: "1000"
      AWS_S3_BUCKET_NAME: ci-test-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3002

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore node_modules
        uses: actions/cache@v4.2.3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turborepo cache
        uses: actions/cache@v4.2.3
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/database db:generate

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      - name: Build API
        run: pnpm --filter api build

      - name: Build web for e2e
        run: pnpm --filter web build:e2e

      - name: Upload API build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: api-build
          path: apps/api/dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload web build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: web-build
          path: apps/web/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload shared build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: shared-build
          path: packages/shared/dist
          if-no-files-found: error
          retention-days: 3

  test-api:
    name: test-api
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_VERSION: "24.16.0"
      PNPM_VERSION: "9.0.0"
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/umbrachat_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret
      THROTTLE_LIMIT: "10000"
      IP_THROTTLE_LIMIT: "10000"
      SESSION_THROTTLE_LIMIT: "10000"
      THROTTLE_BLOCK_MS: "1000"
      AWS_S3_BUCKET_NAME: ci-test-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: umbrachat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d umbrachat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore node_modules
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download shared build
        uses: actions/download-artifact@v4.3.0
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Generate Prisma client
        run: pnpm --filter @repo/database db:generate

      - name: Apply database migrations
        run: pnpm --filter @repo/database db:migrate:deploy

      - name: Run API integration tests
        run: pnpm turbo run test:e2e --filter=api --output-logs=errors-only

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: api-test-results
          path: apps/api/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-web:
    name: test-web
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: "24.16.0"
      PNPM_VERSION: "9.0.0"
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/umbrachat_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret
      THROTTLE_LIMIT: "10000"
      IP_THROTTLE_LIMIT: "10000"
      SESSION_THROTTLE_LIMIT: "10000"
      THROTTLE_BLOCK_MS: "1000"
      AWS_S3_BUCKET_NAME: ci-test-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test-access-key
      AWS_SECRET_ACCESS_KEY: test-secret-key
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3002
      E2E_API_URL: http://localhost:3001
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: umbrachat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d umbrachat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore node_modules
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Turborepo cache
        uses: actions/cache/restore@v4.2.3
        with:
          path: |
            .turbo
            apps/*/.turbo
            packages/*/.turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download web build
        uses: actions/download-artifact@v4.3.0
        with:
          name: web-build
          path: apps/web/.next

      - name: Download API build
        uses: actions/download-artifact@v4.3.0
        with:
          name: api-build
          path: apps/api/dist

      - name: Download shared build
        uses: actions/download-artifact@v4.3.0
        with:
          name: shared-build
          path: packages/shared/dist

      - name: Generate Prisma client
        run: pnpm --filter @repo/database db:generate

      - name: Apply database migrations
        run: pnpm --filter @repo/database db:migrate:deploy

      - name: Restore Playwright browsers
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run web e2e tests
        run: pnpm turbo run test:e2e --filter=web --output-logs=errors-only

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
