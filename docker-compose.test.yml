services:
  postgres-test:
    image: postgres:15-alpine
    container_name: umbra-postgres-test
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: umbrachat_test
    ports:
      - "5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umbrachat_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-test-data:
