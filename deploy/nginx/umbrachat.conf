# UmbraChat - reverse proxy para web, API y WebSocket.
#
# Instalación:
#   sudo cp deploy/nginx/umbrachat.conf /etc/nginx/sites-available/umbrachat.conf
#   sudo ln -sf /etc/nginx/sites-available/umbrachat.conf /etc/nginx/sites-enabled/umbrachat.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: después de apuntar los DNS al VPS ejecutar
#   sudo certbot --nginx -d umbrachat.org -d www.umbrachat.org \
#     -d back.umbrachat.org -d socket.umbrachat.org
# Certbot agrega los bloques 443 y las redirecciones desde HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Frontend: https://umbrachat.org
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name umbrachat.org www.umbrachat.org;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# API REST: https://back.umbrachat.org
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name back.umbrachat.org;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------------
# WebSocket: https://socket.umbrachat.org
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name socket.umbrachat.org;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Las conexiones de Socket.IO son de larga duración.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
