services:
  db:
    image: postgres:15-alpine
    container_name: umbra-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Solo accesible desde el propio VPS (Nginx/API); nunca desde internet.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
